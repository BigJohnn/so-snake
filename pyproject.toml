[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "so-snake"
version = "0.1.0"
description = "Active-perception pick-and-place on the SO-ARM100 (SO-100)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
sim = ["mujoco>=3.2,<4"]
# Real Switch Pro teleoperation. lerobot tracks its GitHub main, per the lab setup.
# Heavy (pulls torch etc.) and hardware-facing, so it is opt-in: the offline gates,
# the sim, and the scripted-waveform viewer all run without it.
# The Switch Pro NintendoTeleop lives only in the lab's linkage-x/lerobot fork,
# on the hph/box_* line -- not in huggingface upstream. Pin the branch that carries it.
teleop = [
    "lerobot @ git+ssh://git@github.com/linkage-x/lerobot.git@box",
    "hidapi>=0.14",       # Switch Pro controller HID
    "feetech-servo-sdk",  # scservo_sdk: STS3215 bus for the real SOFollower arm
    # The USB cameras come with lerobot too: capture goes through its
    # `OpenCVCamera`, and `opencv-python-headless` is an unconditional lerobot
    # dependency, so no camera package is listed here on purpose.
]
# Hardware/data collection still depends on the lerobot checkout used in the lab.
# Keep it out of the minimal install so the offline gates work on macOS and fresh machines.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]
