[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "so-snake"
version = "0.1.0"
description = "Active-perception pick-and-place on the SO-ARM100 (SO-100)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=7"]
sim = ["mujoco>=3.2,<4"]
# Hardware/data collection still depends on the lerobot checkout used in the lab.
# Keep it out of the minimal install so the offline gates work on macOS and fresh machines.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
src = ["src", "tests", "scripts"]
